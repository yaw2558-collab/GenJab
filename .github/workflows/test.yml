name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow customtkinter send2trash

      - name: Run app logic tests
        run: python test_app.py

      - name: Run fast backend tests (no models)
        run: python test_generate.py --fast
